# Builds the game and publishes dist/ to GitHub Pages on every push to main.
# Check, tests and build run first; a red step publishes nothing and the previous deployment
# stays online. The operator details and the developer switch come from repository variables,
# under the same names the container uses (see README, "GitHub Pages").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer push replaces a queued run, while a running deployment is
# left to complete, as in GitHub's Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same Node major as the Dockerfile's build stage.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # legal.json, dev.json and CNAME are the same runtime contract the container fills at
      # start-up (docker/40-legal-json.sh, docker/41-dev-json.sh). Repository *variables*, not
      # secrets: the Impressum is public anyway, and secrets would be masked in the warning.
      - name: Write runtime files
        shell: bash
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          LEGAL_STREET: ${{ vars.LEGAL_STREET }}
          LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
          LEGAL_CITY: ${{ vars.LEGAL_CITY }}
          LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
          LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          LEGAL_HOSTING_PROVIDER: ${{ vars.LEGAL_HOSTING_PROVIDER }}
          DEV_TOOLS: ${{ vars.DEV_TOOLS }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          set -eu
          unset_vars=""
          for name in LEGAL_NAME LEGAL_STREET LEGAL_POSTAL_CODE LEGAL_CITY LEGAL_COUNTRY LEGAL_EMAIL LEGAL_HOSTING_PROVIDER; do
            if [ -z "${!name:-}" ]; then
              unset_vars="$unset_vars $name"
            fi
          done
          if [ -z "$unset_vars" ]; then
            # JSON.stringify escapes quotes, backslashes and control characters; umlauts stay UTF-8.
            node -e '
              const { writeFileSync } = require("node:fs")
              const keys = {
                name: "LEGAL_NAME", street: "LEGAL_STREET", postalCode: "LEGAL_POSTAL_CODE",
                city: "LEGAL_CITY", country: "LEGAL_COUNTRY", email: "LEGAL_EMAIL",
                hostingProvider: "LEGAL_HOSTING_PROVIDER",
              }
              const details = Object.fromEntries(Object.entries(keys).map(([key, env]) => [key, process.env[env]]))
              writeFileSync("dist/legal.json", JSON.stringify(details, null, 2) + "\n")
            '
            echo "legal.json written from the LEGAL_* repository variables"
          else
            echo "::warning title=Placeholder legal details::The Impressum shows placeholder details because these repository variables are unset:$unset_vars"
          fi

          if [ "${DEV_TOOLS:-}" = "true" ]; then
            printf '{"enabled":true}\n' > dist/dev.json
            echo "::notice title=Developer page::DEV_TOOLS=true, the developer page is enabled at #dev"
          else
            printf '{"enabled":false}\n' > dist/dev.json
          fi

          if [ -n "${PAGES_CNAME:-}" ]; then
            printf '%s\n' "$PAGES_CNAME" > dist/CNAME
            echo "CNAME written for $PAGES_CNAME"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
