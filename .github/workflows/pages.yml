# Builds the game and publishes dist/ to the root of the gh-pages branch on every push to main;
# GitHub Pages serves that branch. Check, tests and build run first; a red step publishes nothing
# and the previous deployment stays online. The preview/ folder with the pull request previews
# (pr-preview.yml) is left alone. The operator details and the developer switch come from
# repository variables, under the same names the container uses (see README, "GitHub Pages").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job, which runs no project code, may push.
permissions:
  contents: read

# One deployment at a time: a newer push replaces a queued run, while a running deployment is
# left to complete, as in GitHub's Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs npm ci and the project's scripts, so it holds no write token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same Node major as the Dockerfile's build stage.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # legal.json, dev.json and CNAME are the same runtime contract the container fills at
      # start-up (docker/40-legal-json.sh, docker/41-dev-json.sh). Repository *variables*, not
      # secrets: the Impressum is public anyway, and secrets would be masked in the warning.
      - name: Write runtime files
        shell: bash
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          LEGAL_STREET: ${{ vars.LEGAL_STREET }}
          LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
          LEGAL_CITY: ${{ vars.LEGAL_CITY }}
          LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
          LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          LEGAL_HOSTING_PROVIDER: ${{ vars.LEGAL_HOSTING_PROVIDER }}
          DEV_TOOLS: ${{ vars.DEV_TOOLS }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: bash .github/scripts/write-runtime-files.sh

      # An empty .nojekyll at the branch root makes Pages serve the files as they are (also those
      # of the previews below it) instead of running Jekyll over them.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pushing to the gh-pages branch is all the deployment needs.
    permissions:
      contents: write
    steps:
      # The deploy action works inside a checkout of this repository.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Replaces the root of gh-pages with this build, but keeps the previews.
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: preview/
          # A preview pushed in between makes the push non-fast-forward; the action fetches and
          # retries.
          attempt-limit: 5
