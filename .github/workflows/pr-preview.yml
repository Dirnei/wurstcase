# Publishes a playable build of every pull request to the gh-pages branch under
# preview/pr-<N>/ and links it in one sticky PR comment; closing or merging the pull request
# removes the preview. Check, tests and build run first; a red step publishes nothing and the
# previous preview stays online. Previews get the same legal.json as the live site, the developer
# page switched on, and never a CNAME (see README, "GitHub Pages").
name: Pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Read-only by default; only the deploy job, which runs no pull request code, may write.
permissions:
  contents: read

# A newer push to the same pull request replaces its running or queued run, so the last commit
# (or the close) always wins.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    # No preview for fork pull requests (their token cannot write here) or Dependabot's.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Runs npm ci and the pull request's code, so it holds no write token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same Node major as the Dockerfile's build stage.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Same script and variables as the live deployment, but the developer page is always on
      # and PAGES_CNAME stays empty, so a preview never claims the domain.
      - name: Write runtime files
        shell: bash
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          LEGAL_STREET: ${{ vars.LEGAL_STREET }}
          LEGAL_POSTAL_CODE: ${{ vars.LEGAL_POSTAL_CODE }}
          LEGAL_CITY: ${{ vars.LEGAL_CITY }}
          LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
          LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          LEGAL_HOSTING_PROVIDER: ${{ vars.LEGAL_HOSTING_PROVIDER }}
          DEV_TOOLS: 'true'
          PAGES_CNAME: ''
        run: bash .github/scripts/write-runtime-files.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    # Runs after a green build, and on close without one, to remove the preview.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    # Pushing the preview to gh-pages and posting the comment. A push that meets a newer gh-pages
    # (the live deploy or another preview) is fetched and retried by the action.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The deploy action works inside a checkout of this repository.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the build
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: preview
          path: dist

      # Deploys on open and new commits, removes on close; keeps one sticky comment with the link.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: dist
          umbrella-dir: preview
          action: auto
          pages-base-url: ${{ vars.PAGES_CNAME || format('{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
