# Log client IPs only in shortened form: last IPv4 octet / all but the first 48 IPv6 bits zeroed.
# Anything that doesn't match is logged as 0.0.0.0 rather than in full.
map $remote_addr $remote_addr_anon {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$                     $a.0;
    ~^(?P<a>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $a::;
    default                                          0.0.0.0;
}

log_format anonymized '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log anonymized;

    # Browsers send every cookie set on the host name (all localhost apps share one jar), which
    # easily exceeds nginx's 8 KB default and turns into "400 Request Header Or Cookie Too Large".
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # The game page must revalidate on every load so players get new releases immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Operator details for the legal pages, written at container start by 40-legal-json.sh.
    location = /legal.json {
        alias /tmp/legal/legal.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite puts a content hash in these file names, so they never change under the same URL.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
